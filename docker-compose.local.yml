services:
  postgres:
    image: postgres:16-alpine
    container_name: pramaan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local Postgres}
      POSTGRES_DB: pramaan
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pramaan"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local Postgres}@postgres:5432/pramaan
      DIRECT_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local Postgres}@postgres:5432/pramaan
    depends_on:
      postgres:
        condition: service_healthy
      biometrics:
        condition: service_healthy

volumes:
  pgdata: